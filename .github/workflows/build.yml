name: Build Kinetiq APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only builds and uploads artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (generator, calories, DB validator, import validation)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (includes merged-manifest no-INTERNET check)
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify offline guarantee (no INTERNET permission in APK)
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::Release APK declares INTERNET permission — offline guarantee violated"
            exit 1
          fi
          echo "OK: release APK has no INTERNET permission."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetiq-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Runners have no ~/.android/debug.keystore, so AGP mints a fresh random debug key on every
      # run. These APKs are therefore signed with a different key each build: fine for smoke
      # testing, but they cannot be installed over one another and carry no stable provenance.
      # The value of the assembleRelease step is the no-INTERNET check and the R8 pass, not this.
      - name: Upload release APK (CI-signed with an ephemeral key — NOT upgradable)
        uses: actions/upload-artifact@v4
        with:
          name: kinetiq-release-apk-ci-ephemeral-key
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
